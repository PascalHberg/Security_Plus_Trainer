  <div id="question-screen" class="screen hidden">
    <div id="progress"></div>
    <div id="question"></div>
    <ul id="choices" class="choices"></ul>
    <div id="feedback" class="feedback hidden"></div>
    <div class="controls">
      <button id="next-btn" disabled>Weiter</button>
      <button id="quit-btn">Beenden</button>
    </div>
  </div>

  <div id="review-screen" class="screen hidden">

    <ul id="category-summary"></ul>
    <button id="restart-btn">Neue Prüfung</button>
  </div>
</div>
